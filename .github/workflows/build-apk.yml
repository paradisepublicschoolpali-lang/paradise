name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Locate & Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/ParadisePublicSchool-v1.0.0.apk
          echo "APK generated successfully at build-output/ParadisePublicSchool-v1.0.0.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParadisePublicSchool-APK
          path: build-output/ParadisePublicSchool-v1.0.0.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Paradise Public School Mobile App v1.0.0
          body: |
            ### 🏫 Paradise Public School • Official Android Application (v1.0.0)
            *Estd. 1994 • CBSE Affiliation No: 2130842 • Pali, Rajasthan*

            #### 📱 Release Features:
            - **Parent & Student Portal**: Multi-child profile switcher, attendance ledger, and leave application.
            - **Academics Desk**: Daily timetable, homework tasks, CBSE examination report cards.
            - **Fee Treasury**: Quarterly fee invoices, breakdowns, UPI settlements, and digital receipts.
            - **School Communication**: Official circulars with PDF viewer and direct faculty chat.
            - **Admissions & Facilities**: Digital admission inquiry, Jr. STEM Robotics Lab showcase, campus tour.

            #### 📦 Download:
            Download **`ParadisePublicSchool-v1.0.0.apk`** below to install directly on your Android phone or tablet.
          files: build-output/ParadisePublicSchool-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
